name: CI

# Runs on every pull request and blocks merge on failure (DECISIONS.md §14).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catches content-schema mismatches and missing translations —
      # loadPage() throws when a static page lacks a locale (DECISIONS.md §5).
      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  links:
    name: Broken link check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Catches the classic "renamed a page, forgot a link in the footer".
      # Internal links only — external link rot shouldn't block a merge.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            'dist/**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Performance budget lives in lighthouserc.json. It is deliberately NOT a
      # "zero JS" budget — the site is animation-heavy by design (DECISIONS.md §12).
      # The budget exists to catch an accidental heavyweight dependency.
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
